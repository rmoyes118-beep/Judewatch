name: Rose Stock Watch

on:
  schedule:
    - cron: "2/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-roses:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Check Roses
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python check_jude.py

      - name: Save state
        run: |
          git config user.name "Rose Watch"
          git config user.email "rose-watch@users.noreply.github.com"
          git add *_state.txt
          git diff --cached --quiet || git commit -m "Update rose stock state"
          git push
